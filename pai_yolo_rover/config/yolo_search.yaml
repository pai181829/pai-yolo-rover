yolo_search:
  ros__parameters:
    conf: 0.25
    imgsz: 640
    device: cpu            # "0" for the first CUDA GPU
    control_period: 0.2    # s (5 Hz perception + control loop)
    search_ang_vel: 0.45   # rad/s while searching
    max_lin_vel: 0.35      # m/s while approaching
    k_ang: 1.1             # P gain for keeping the target centred
    arrive_ratio: 0.50     # default "close enough" bbox size (height / image height)
    arrive_overrides: ['stop sign:0.42', 'fire hydrant:0.45', 'person:0.66']
    lost_tolerance: 15
    hold_time: 2.0
    backoff_time: 1.6
